<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/mauricio.css">
    <link rel="stylesheet" href="css/eamonn.css">
    <script src="js/mauricio.js" defer></script>
    <script src="js/eamonn.js" defer></script>
    <title>Ink & Iron - Tattoo Shop</title>
</head>
<body>
    <nav>
        <!-- The menu is being rendered in js for easyness and consistency. -->
         <!-- Once it is created, We place the code in the JS file -->
          <div class="render-menu"></div>
    </nav>

    <!-- ======================================================== 
         HEADER
    ======================================================== -->
    <header>
        <h1>
            PAGE TITLE <!-- Change here  -->
        </h1>
    </header>
    <main>
        <section>
            <div class="" id="">
                 <!-- ======================================================== 
                    All content inside section goes in a div.
                    Always 1 or 2 columns max. Except if its a gallery.
                    If its a gallery we'll use grid layout.
                    Everything else using flexbox.
                  ======================================================== -->
                  <h4>Small text above h2</h4>
                  <h2>
                      <!-- All main headers will be H2 using the separator div below it: -->
                      SECTION HEADER
                    </h2>
                    <!-- separator div is a constant below EVERY H2! -->
                    <div class="separator-slot"></div> 
                    <div class="subtitle-container">
                        paragraph explaining the section
                    </div>
                </div>

        </section>

        <!-- DON NOT CHANGE THE BLOCKS BELOW -->
        <!-- They go at the bottom of every page, like a template -->
        <!-- They are being rendered in JS in mauricio.js -->
        <section>
            <div class="render-map"></div>
        </section>
    </main>

    <footer>
        <!-- Footer always here -->
    </footer>    
</body>
</html>
